# Pubblica il sito su GitHub Pages a ogni push su main.
# Il sito è statico: non c'è build, si carica la cartella così com'è.
name: Deploy su GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:      # permette di rilanciare il deploy a mano dalla tab Actions

permissions:
  contents: read
  pages: write
  id-token: write

# Un deploy alla volta; non annulla quello in corso per non lasciare il sito a metà.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura GitHub Pages
        uses: actions/configure-pages@v5

      - name: Carica il sito come artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: '.'

      - name: Deploy su GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
